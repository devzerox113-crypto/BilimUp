name: Build APK

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

defaults:
  run:
    working-directory: ubt_launcher

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      python -m pip install --upgrade pip
      python -m pip install buildozer "cython<3" setuptools

  - name: Build APK
    run: buildozer -v android debug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: BilimUp-APK
      path: ubt_launcher/bin/*.apk
      if-no-files-found: error
      retention-days: 14
